<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/new-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Precision Manufacturing</title>
    <meta name="description" content="Top Precision Manufacturing Sdn Bhd">
    <!-- Google Translate Script (from existing header) -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'zh-CN,zh-TW',
          autoDisplay: false
        }, 'google_translate_hidden');
      }
      function setLang(lang) {
        const targetLang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('.lang-btn').forEach(b => {
          b.classList.toggle('active', b.getAttribute('data-lang') === lang);
        });
        if (lang === 'en') {
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + location.hostname + '; path=/;';
          window.location.reload();
        } else {
          const selectField = document.querySelector('.goog-te-combo');
          if (selectField) {
            selectField.value = targetLang;
            selectField.dispatchEvent(new Event('change'));
          }
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div id="google_translate_hidden" style="display:none;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
